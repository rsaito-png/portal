<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>ご利用実績・実費の確認｜レオ</title>
<style>
body{font-family:system-ui,"Hiragino Sans",sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#e8833a;color:#fff;padding:14px 16px;font-size:18px}
main{max-width:560px;margin:auto;padding:16px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px #0002;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid #eee;padding:7px 4px;text-align:left}
table.money th{font-weight:normal;width:46%}table.money td{text-align:right;font-variant-numeric:tabular-nums}
label{display:block;margin:12px 0 4px;font-weight:bold}input[type=text],textarea{width:100%;box-sizing:border-box;font-size:17px;padding:10px;border:1px solid #bbb;border-radius:8px}
.ch label{font-weight:normal;margin:6px 0;font-size:17px}button{font-size:18px;width:100%;padding:14px;border:0;border-radius:8px;background:#e8833a;color:#fff;margin-top:14px}
a.pay{display:block;text-align:center;margin-top:10px;padding:12px;border-radius:8px;background:#fff;color:#e8833a;border:1px solid #e8833a;text-decoration:none;font-weight:bold}
canvas{border:1px solid #bbb;border-radius:8px;width:100%;height:150px;touch-action:none;background:#fff}.sub{background:#fff;color:#333;border:1px solid #bbb;width:auto;padding:6px 12px;font-size:14px;margin:4px 0}
.note{color:#777;font-size:13px}.ok{color:#2e6b4f;font-weight:bold}.err{color:#c00}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="theme-retro.css?v=20261030px">
</head><body><header>レオ　ご利用実績・実費の確認</header><main id="m"><p>読み込み中…</p></main>
<script src="config.js"></script>
<script>
// 保護者向け：ログインなし。リンクのトークンで、その児童・その月の実績と実費だけを表示（ほかの児童の情報は出さない）
// 実費はお昼代・おやつ代。利用者負担額は載せない。一度の送信で実績と実費の両方を確認したことになる
const C = window.PORTAL_CONFIG, q = new URLSearchParams(location.search);
const DEMO = q.get('demo') === '1', T = q.get('t') || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rpc = (fn, body) => fetch(C.supabaseUrl + '/rest/v1/rpc/' + fn, { method: 'POST',
  headers: { apikey: C.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const DEMO_DATA = { child: '児童A（見本）', month: '2026-11', last: null,
  jippi: { found: true, lunch: 1200, snack: 400, total: 1600, pay_link: 'https://square.link/u/demo' },
  rows: [
  { day: '2026-11-02', status: '利用', start: '14:45', end: '17:00' }, { day: '2026-11-04', status: '利用', start: '14:45', end: '17:00' },
  { day: '2026-11-06', status: '欠席', start: '', end: '' }, { day: '2026-11-09', status: '利用', start: '10:00', end: '16:00' } ] };
const fmt = d => {
  const x = new Date(d + 'T00:00:00+09:00');
  const p = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', weekday: 'short' }).formatToParts(x);
  const get = t => (p.find(v => v.type === t) || {}).value || '';
  const wk = { Sun: '日', Mon: '月', Tue: '火', Wed: '水', Thu: '木', Fri: '金', Sat: '土' };
  return `${get('month')}/${get('day')}（${wk[get('weekday')] || ''}）`;
};
const yen = n => Number(n || 0).toLocaleString('ja-JP') + '円';
function jippiHtml(j) {
  if (!j) return `<div class="card" id="jippi"><b>実費負担（お昼代・おやつ代）</b><p class="err">実費を表示できませんでした。時間をおいて開き直してください。確認自体は送れます。</p>
    <p class="note">実費はお昼代とおやつ代だけです。利用者負担額（国保連の請求）はここには入りません。</p></div>`;
  const lunch = Number(j.lunch || 0), snack = Number(j.snack || 0), total = lunch + snack, none = !j.found || total <= 0;
  const pay = !none && /^https:\/\//.test(j.pay_link || '')
    ? `<a class="pay" href="${esc(j.pay_link)}" target="_blank" rel="noopener">お支払いページを開く</a><p class="note">支払いは、確認の前でもあとでも大丈夫です。</p>`
    : (none ? '' : '<p class="note">支払い用のリンクはまだありません。リンクが無くても、確認は送れます。</p>');
  return `<div class="card" id="jippi"><b>実費負担（お昼代・おやつ代）</b>
    ${none ? '<p id="jippi-none">この月の実費負担はありません。</p>' : `<table class="money"><tr><th>お昼代</th><td id="jippi-lunch">${yen(lunch)}</td></tr><tr><th>おやつ代</th><td id="jippi-snack">${yen(snack)}</td></tr><tr><th>合計</th><td id="jippi-total"><b>${yen(total)}</b></td></tr></table>`}
    ${pay}
    <p class="note">実費はお昼代とおやつ代だけです。利用者負担額（国保連の請求）はここには入りません。</p></div>`;
}

async function load() {
  let d = DEMO ? DEMO_DATA : null;
  if (!DEMO) {
    if (!/^[0-9a-f]{48}$/.test(T)) return bad();
    const r = await rpc('leo_confirm_get', { p_token: T }); d = r.ok ? await r.json() : null;
    if (!d) return bad();
  }
  const [y, mo] = d.month.split('-').map(Number);
  $m().innerHTML = `<div class="card"><b>${esc(d.child)}</b> さん　${y}年${mo}月のご利用実績
    <table><tr><th>日付</th><th>状況</th><th>時間</th></tr>${d.rows.map(r => `<tr><td>${fmt(r.day)}</td><td>${esc(r.status)}</td><td>${r.start ? esc(r.start) + '〜' + esc(r.end) : ''}</td></tr>`).join('') || '<tr><td colspan=3>この月の記録はまだありません</td></tr>'}</table>
    <p class="note">利用 ${d.rows.filter(r => r.status === '利用').length}回</p></div>
    ${jippiHtml(d.jippi)}
    ${d.last ? `<p class="ok">${new Date(d.last.at).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' })} に「${esc(d.last.confirm)}」でご回答いただいています。内容を直すときは、もう一度送ってください。</p>` : ''}
    <div class="card"><p class="note">下の送信で、上のご利用実績と実費負担の両方を確認したことになります。</p><label>確認</label><div class="ch">
      <label><input type="radio" name="cf" value="内容に相違ありません"> 内容に相違ありません</label>
      <label><input type="radio" name="cf" value="相違があります"> 相違があります</label></div>
    <label>保護者氏名</label><input type="text" id="pn" maxlength="60" autocomplete="name">
    <label>相違点・ご意見（任意）</label><textarea id="cm" rows="3" maxlength="2000"></textarea>
    <button onclick="send()">送信する</button><p id="r"></p></div>
    <p class="note">このページはご家庭ごとの専用リンクです。ほかの方には送らないでください。</p>`;
}
const $m = () => document.getElementById('m');
const bad = () => $m().innerHTML = '<div class="card">リンクが正しくないか、期限が切れています。お手数ですがレオまでご連絡ください。</div>';
async function send() {
  const cf = document.querySelector('input[name=cf]:checked'), pn = document.getElementById('pn').value.trim(), out = document.getElementById('r');
  if (!cf) { out.innerHTML = '<span class="err">「確認」を選んでください。</span>'; return; }
  if (!pn) { out.innerHTML = '<span class="err">保護者氏名を入れてください。</span>'; return; }
  if (cf.value === '相違があります' && !document.getElementById('cm').value.trim()) { out.innerHTML = '<span class="err">相違点をお書きください。</span>'; return; }
  if (DEMO) { out.innerHTML = '<span class="ok">見本なので送信しません（本番では保存されます）。</span>'; return; }
  const r = await rpc('leo_confirm_submit', { p_token: T, p_confirm: cf.value, p_parent: pn, p_comment: document.getElementById('cm').value,
    p_signature: '' });
  out.innerHTML = r.ok ? '<span class="ok">送信しました。ありがとうございました。</span>' : '<span class="err">送信できませんでした。時間をおいてもう一度お試しください。</span>';
  if (r.ok) document.querySelector('.card:last-of-type button:last-of-type').disabled = true;
}
load();
</script></body></html>
