<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>ご利用の確認と署名｜金斗雲</title>
<style>
html,body{overscroll-behavior:none}
#ov,#prev,#cv{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Hiragino Sans",sans-serif;margin:0;background:#f4f6f8;color:#222;-webkit-text-size-adjust:100%}
header{background:#2e6b4f;color:#fff;padding:14px 16px;font-size:18px}
main{max-width:560px;margin:auto;padding:16px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px #0002;margin:12px 0}
.v{border-bottom:1px solid #eee;padding:10px 0}.v:last-child{border:0}.v label{display:flex;gap:10px;font-size:17px;align-items:flex-start}.v input{width:24px;height:24px;flex:none}
.sm{color:#666;font-size:14px;margin:2px 0 0 34px;white-space:pre-wrap}
#prev{border:2px dashed #888;border-radius:8px;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#666;background:#fff;padding:8px}
.mt{display:block;font-size:17px;margin:8px 0}.mt input{width:22px;height:22px;vertical-align:middle;margin-right:8px}
body.lock{overflow:hidden;position:fixed;width:100%;touch-action:none}
#ov{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;background:#fff;z-index:9;touch-action:none;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}#ov[hidden]{display:none}#cvw{flex:1;min-height:0;position:relative}#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
#dlg{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center}#dlg[hidden]{display:none}#dlg div{background:#fff;border-radius:12px;padding:22px;max-width:80%;text-align:center;font-size:18px;box-sizing:border-box}#dlg b{display:block;font-size:22px;margin-bottom:8px;color:#2e6b4f}#dlg button{margin-top:14px}
#ovb{flex:none;padding:8px 10px;background:#fff;display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid #ccc}#ovb span{color:#888;font-size:14px}#ovb button{margin:0}.ok2{width:auto;padding:10px 18px;font-size:16px;margin:0}
input[type=text],textarea{width:100%;box-sizing:border-box;font-size:17px;padding:10px;border:1px solid #bbb;border-radius:8px;margin-top:4px}
button{font-size:18px;width:100%;padding:14px;border:0;border-radius:8px;background:#2e6b4f;color:#fff;margin-top:14px}button:disabled{background:#999}
.sub{background:#fff;color:#333;border:1px solid #bbb;width:auto;padding:6px 14px;font-size:14px;margin:6px 0}
.note{color:#777;font-size:13px}.ok{color:#2e6b4f;font-weight:bold}.err{color:#c00}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="theme-retro.css?v=20261030px">
</head><body><header>金斗雲　ご利用の確認と署名</header><main id="m"><p>読み込み中…</p></main>
<script src="config.js"></script>
<script src="signpad.js"></script>
<script>
// 本人向け：ログインなし。リンクのトークンで、その方の署名待ちの訪問だけを表示。1回限り・期限1週間。
const C = window.PORTAL_CONFIG, q = new URLSearchParams(location.search), T = q.get('t') || '', DEMO = q.get('demo') === '1';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rpc = (fn, body) => fetch(C.supabaseUrl + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: C.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const $m = () => document.getElementById('m'), $ = id => document.getElementById(id);
const fmt = d => { const x = new Date(d + 'T00:00:00+09:00'); return `${x.getMonth() + 1}/${x.getDate()}（${'日月火水木金土'[x.getDay()]}）`; };
const DEMO_DATA = { name: '利用者A（見本）', expires_at: new Date(Date.now() + 6048e5).toISOString(), visits: [
  { id: 1, date: '2026-11-02', start: '07:00', end: '07:30', minutes: 30, service: '身体介護', staff: '職員A', content: '朝食の準備・配膳・片付け', note: null },
  { id: 2, date: '2026-11-02', start: '18:00', end: '18:30', minutes: 30, service: '身体介護', staff: '職員B', content: '夕食の準備', note: null }] };
let D = null;
const bad = () => $m().innerHTML = '<div class="card">リンクが正しくないか、期限が切れている・すでに使われています。お手数ですが金斗雲までご連絡ください。</div>';
const mon = d => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() - ((x.getUTCDay() + 6) % 7)); return x.toISOString().slice(0, 10); };
const wlabel = m => { const a = new Date(m + 'T00:00:00Z'), b = new Date(a.getTime() + 6 * 864e5), f = x => `${x.getUTCMonth() + 1}/${x.getUTCDate()}`; return `${f(a)}〜${f(b)}の週`; };
async function load() {
  if (DEMO) D = DEMO_DATA;
  else { if (!/^[0-9a-f]{48}$/.test(T)) return bad(); const r = await rpc('kin_sign_get', { p_token: T }); D = r.ok ? await r.json() : null; if (!D) return bad(); }
  if (!D.visits.length) { $m().innerHTML = '<div class="card">署名待ちの訪問はありません。</div>'; return; }
  const wk = {}; D.visits.forEach(v => (wk[mon(v.date)] = wk[mon(v.date)] || []).push(v));
  const weeks = Object.keys(wk).sort();
  $m().innerHTML = `<div class="card"><b>${esc(D.name)}</b> さん<br>内容をご確認のうえ、署名する訪問にチェックを入れてください。週ごとにまとめて選べます（過去の週も署名できます）。</div>
  ${weeks.map((w, i) => `<div class="card"><b>${wlabel(w)}</b>（${wk[w].length}件）　<button class="sub" onclick="wsel(${i},true)">この週をすべて選ぶ</button><button class="sub" onclick="wsel(${i},false)">はずす</button>
  ${wk[w].map(v => `<div class="v"><label><input type="checkbox" class="vc w${i}" value="${v.id}" checked><span>${fmt(v.date)} ${esc(v.start)}〜${esc(v.end)}（${v.minutes}分）　${esc(v.service)}${v.staff ? '　担当：' + esc(v.staff) : ''}</span></label>${v.content ? `<div class="sm">${esc(v.content)}</div>` : ''}${v.note ? `<div class="sm">特記：${esc(v.note)}</div>` : ''}</div>`).join('')}</div>`).join('')}
  <div class="card"><b>署名の方法</b>
   <label class="mt"><input type="radio" name="mt" value="本人" checked onchange="mtc()"> 本人が署名する</label>
   <label class="mt"><input type="radio" name="mt" value="ご家族" onchange="mtc()"> ご家族が署名する</label>
   <label class="mt"><input type="radio" name="mt" value="署名困難" onchange="mtc()"> 署名が難しい</label>
   <label class="mt"><input type="radio" name="mt" value="あとで署名" onchange="mtc()"> あとで署名する</label>
   <div id="rel" hidden><label>ご署名される方の続柄（必須）<input type="text" id="relv" maxlength="30" placeholder="例：母"></label></div>
   <div id="rsn" hidden><label>署名が難しい理由（必須）<textarea id="rsnv" rows="2" maxlength="500"></textarea></label></div>
   <div id="sg"><p>署名（下の枠をタップすると、画面いっぱいで書けます）</p><div id="prev" onclick="openPad()">タップして署名を書く</div></div>
   <p class="note" id="lt" hidden>「あとで署名」を選んでも、記録は署名待ちのまま残ります。このリンクは、あとでもう一度使えます。</p>
   <button id="go" onclick="send()">送信する</button><p id="r"></p></div>
  <p class="note">このページはご本人専用のリンクで、署名が済むと使えなくなります（期限：${esc(new Date(D.expires_at).toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo' }))}まで）。ほかの方には送らないでください。選ばなかった訪問は、あらためて新しいリンクで署名します。</p>
  <div id="ov" hidden><div id="cvw"><canvas id="cv"></canvas></div><div id="ovb"><span>指で書いてください</span><button class="sub" onclick="padClr()">書き直す</button><button class="sub" onclick="padClose(false)">閉じる</button><button class="ok2" onclick="padClose(true)">これでよい</button></div></div>`;
  document.querySelectorAll('.vc').forEach(c => c.addEventListener('change', () => {}));
}
const meth = () => document.querySelector('input[name=mt]:checked').value;
function wsel(i, on) { document.querySelectorAll('.w' + i).forEach(c => c.checked = on); }
function mtc() { const m = meth(); $('rel').hidden = m !== 'ご家族'; $('rsn').hidden = m !== '署名困難'; $('sg').hidden = !(m === '本人' || m === 'ご家族'); $('lt').hidden = m !== 'あとで署名'; $('go').textContent = m === 'あとで署名' ? 'あとで署名する（記録は残します）' : '送信する'; }
// 全画面の署名パッド：記録ボット作の署名欄部品（signpad.js）を全画面の canvas で使い、画面全体で指の動きを拾う
let pad = null, sigData = null;
let scrollY0 = 0;
function lockBody() { if (document.body.classList.contains('lock')) return; scrollY0 = window.scrollY; document.body.style.top = (-scrollY0) + 'px'; document.body.classList.add('lock'); }
function unlockBody() { if (!document.body.classList.contains('lock')) return; document.body.classList.remove('lock'); document.body.style.top = ''; window.scrollTo(0, scrollY0); }
function padRemeasure() { if (pad && !$('ov').hidden) pad.remeasure(); }
function openPad() {
  lockBody(); $('ov').hidden = false;
  if (!pad) pad = createSignPad($('cv')); pad.clear(); pad.remeasure();
  requestAnimationFrame(padRemeasure);
}
window.addEventListener('resize', padRemeasure);
window.addEventListener('orientationchange', () => { padRemeasure(); setTimeout(padRemeasure, 300); });
function showDlg(t, m) { $('dlgt').textContent = t; $('dlgm').textContent = m || ''; $('dlg').hidden = false; }
function padClr() { pad.clear(); sigData = null; }
function padClose(ok) {
  unlockBody(); $('ov').hidden = true;
  if (ok && pad.isDrawn()) { // 書いた範囲だけを切り出し、幅600pxまでに縮小してPNG化（白背景）
    const cv = $('cv'), g0 = cv.getContext('2d'), W = cv.width, H = cv.height, d = g0.getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = 0, y1 = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = (y * W + x) * 4; if (d[i] < 200) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
    if (x1 < x0) { sigData = null; $('prev').textContent = 'タップして署名を書く'; return; }
    const p = 16, sx = Math.max(0, x0 - p), sy = Math.max(0, y0 - p), sw = Math.min(W - sx, x1 - x0 + 2 * p), sh = Math.min(H - sy, y1 - y0 + 2 * p), sc = Math.min(1, 600 / sw);
    const t = document.createElement('canvas'); t.width = Math.max(1, Math.round(sw * sc)); t.height = Math.max(1, Math.round(sh * sc)); const g = t.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, t.width, t.height); g.drawImage(cv, sx, sy, sw, sh, 0, 0, t.width, t.height);
    sigData = t.toDataURL('image/png'); $('prev').innerHTML = `<img src="${sigData}" alt="署名" style="max-width:100%;max-height:120px"><div class="note">タップして書き直し</div>`;
  } else if (!sigData) $('prev').textContent = 'タップして署名を書く';
}
async function send() {
  const ids = [...document.querySelectorAll('.vc:checked')].map(c => +c.value), out = $('r'), m = meth(), rel = $('relv') ? $('relv').value.trim() : '', rs = $('rsnv') ? $('rsnv').value.trim() : '';
  if (!ids.length) { out.innerHTML = '<span class="err">訪問を選んでください。</span>'; return; }
  if ((m === '本人' || m === 'ご家族') && !sigData) { out.innerHTML = '<span class="err">署名を書いてください。</span>'; return; }
  if (m === 'ご家族' && !rel) { out.innerHTML = '<span class="err">続柄を入れてください。</span>'; return; }
  if (m === '署名困難' && !rs) { out.innerHTML = '<span class="err">理由を入れてください。</span>'; return; }
  if (DEMO) { out.innerHTML = '<span class="ok">見本なので送信しません。</span>'; return; }
  $('go').disabled = true;
  let r; try { r = await rpc('kin_sign_submit', { p_token: T, p_visit_ids: ids, p_method: m, p_signature: (m === '本人' || m === 'ご家族') ? sigData : null, p_relation: m === 'ご家族' ? rel : null, p_reason: m === '署名困難' ? rs : null }); } catch (e) { r = { ok: false }; }
  if (r.ok) { showDlg('送信しました', ''); $m().innerHTML = '<div class="card ok">' + (m === 'あとで署名' ? 'あとで署名として記録しました（' + ids.length + '件）。このリンクは、期限までもう一度使えます。' : '署名を記録しました（' + ids.length + '件）。ありがとうございました。このページは閉じて大丈夫です。') + '</div>'; }
  else { $('go').disabled = false; out.innerHTML = '<span class="err">送信できませんでした。リンクが使用済み・期限切れの可能性があります。金斗雲までご連絡ください。</span>'; }
}
load();
</script>
<div id="dlg" hidden><div><b id="dlgt"></b><span id="dlgm"></span><button onclick="document.getElementById('dlg').hidden=true">閉じる</button></div></div></body></html>
