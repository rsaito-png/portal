<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>レオ</title>
<style>
body{font-family:system-ui,"Hiragino Sans",sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#e8833a;color:#fff;padding:14px 16px;font-size:18px}
main{max-width:560px;margin:auto;padding:16px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px #0002;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid #eee;padding:7px 4px;text-align:left}
label{display:block;margin:12px 0 4px;font-weight:bold}input[type=text],textarea{width:100%;box-sizing:border-box;font-size:17px;padding:10px;border:1px solid #bbb;border-radius:8px}
.ch label{font-weight:normal;margin:6px 0;font-size:17px}button{font-size:18px;width:100%;padding:14px;border:0;border-radius:8px;background:#e8833a;color:#fff;margin-top:14px}
canvas{border:1px solid #bbb;border-radius:8px;width:100%;height:150px;touch-action:none;background:#fff}.sub{background:#fff;color:#333;border:1px solid #bbb;width:auto;padding:6px 12px;font-size:14px;margin:4px 0}
.note{color:#777;font-size:13px}.ok{color:#2e6b4f;font-weight:bold}.err{color:#c00}
</style></head><body><header id="hd">レオ</header><main id="m"><p>読み込み中…</p></main>
<script src="config.js"></script>
<script>
// 保護者向け（ログインなし）：k=mon … モニタリングアンケート（現行Googleフォームの設問を写したもの）／k=doui … 個別支援計画（原案・本案）の同意
const C = window.PORTAL_CONFIG, q = new URLSearchParams(location.search), DEMO = q.get('demo') === '1', T = q.get('t') || '', K = q.get('k');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rpc = (fn, body) => fetch(C.supabaseUrl + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: C.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const $m = () => document.getElementById('m');
const bad = () => $m().innerHTML = '<div class="card">リンクが正しくないか、期限が切れています。お手数ですがレオまでご連絡ください。</div>';
// 設問（「レオ：モニタリングアンケート（保護者用）」の回答シートの列順。評価は1〜5）
const MON = [['grade', '現在の学年/年齢', 'text'],
  ['adl', 'ADL（日常生活動作）の自立度', 'rate'], ['body', '身体のコントロールと感覚の安定', 'rate'], ['free1', '自由記述欄', 'area'],
  ['emo', '情緒の安定と自己統制', 'rate'], ['env', '環境への適応と理解', 'rate'], ['free2', '自由記述欄', 'area'],
  ['comm', '意思疎通と自己表現', 'rate'], ['social', '対人関係と集団適応', 'rate'], ['free3', '自由記述欄', 'area'],
  ['change', '直近6ヶ月の顕著な変容（成長や新たな課題）', 'area'], ['wish', '家庭での困りごと・次期支援計画への要望', 'area']];
async function load() {
  const fn = K === 'mon' ? 'leo_mon_get' : K === 'doui' ? 'leo_doui_get' : null; if (!fn) return bad();
  let d;
  if (DEMO) d = K === 'mon' ? { child: '児童A（見本）', term: '第3期', done: false } : { child: '児童A（見本）', term_no: 3, doc: q.get('doc') || '原案', start: '2026-11-01', end: '2027-04-30', done: null,
    text: '（見本）\n【 総合的な援助の方針 】\n安心できる環境の中で、自分の気持ちを言葉で伝える力を育てます。\n\n【長期目標】\n友だちと一緒に遊びを楽しめる。' };
  else { if (!/^[0-9a-f]{48}$/.test(T)) return bad(); const r = await rpc(fn, { p_token: T }); d = r.ok ? await r.json() : null; if (!d) return bad(); }
  if (K === 'mon') {
    document.getElementById('hd').textContent = 'レオ　モニタリングアンケート';
    $m().innerHTML = `<div class="card"><b>${esc(d.child)}</b> さん（${esc(d.term)}の計画づくりのため）<p class="note">ご家庭での様子を教えてください。評価は 1〜5 で、数字が小さいほど「困りごとが大きい」、大きいほど「できている・安定している」です。</p>
      ${d.done ? '<p class="ok">すでにご回答いただいています。直すときはもう一度送ってください。</p>' : ''}</div>
      <div class="card">${MON.map(([k, l, t]) => `<label>${esc(l)}</label>` + (t === 'rate' ? `<div class="ch" style="display:flex;gap:6px">${[1, 2, 3, 4, 5].map(n => `<label style="flex:1;text-align:center;border:1px solid #bbb;border-radius:8px;padding:10px 0"><input type="radio" name="${k}" value="${n}"><br>${n}</label>`).join('')}</div>`
        : t === 'area' ? `<textarea id="${k}" rows="3" maxlength="2000"></textarea>` : `<input type="text" id="${k}" maxlength="40">`)).join('')}
      <button onclick="sendMon()">送信する</button><p id="r"></p></div><p class="note">このページはご家庭ごとの専用リンクです。ほかの方には送らないでください。</p>`;
  } else {
    document.getElementById('hd').textContent = `レオ　個別支援計画（${d.doc}）の同意`;
    const f = s => { const x = new Date(s + 'T00:00:00+09:00'); return `${x.getFullYear()}年${x.getMonth() + 1}月${x.getDate()}日`; };
    const dt = s => new Date(s).toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo' });
    if (d.expired) { $m().innerHTML = '<div class="card">このリンクは期限が切れています。お手数ですがレオまでご連絡ください。</div>'; return; }
    const mk = t => esc(t || '').split('\n').map(l => l.startsWith('#T ') ? `<h3 style="text-align:center">${l.slice(3)}</h3>` : l.startsWith('#R ') ? `<div style="text-align:right">${l.slice(3)}</div>` : `<div>${l || '&nbsp;'}</div>`).join('');
    $m().innerHTML = `<div class="card"><b>${esc(d.child)}</b> さん　第${d.term_no}期 個別支援計画（${esc(d.doc)}）<br><small>計画期間：${f(d.start)} 〜 ${f(d.end)}${d.sent_at ? '／送付日：' + dt(d.sent_at) : ''}</small>
      <div style="margin-top:10px;font-size:15px;line-height:1.7">${mk(d.text) || '（まだ本文がありません。レオにお問い合わせください）'}</div></div>
      ${d.done ? `<p class="ok">${dt(d.done)} に同意をいただきました。ありがとうございました。</p>`
      : `<div class="card"><p>上の内容を確認しました。この個別支援計画（${esc(d.doc)}）に同意します。</p><button id="agb" onclick="sendDoui()">同意します</button><p id="r"></p></div>
      <p class="note">${d.doc === '原案' ? '原案に同意していただいたあと、担当者会議を経て、本案の同意をあらためてお願いします。' : ''}このページはご家庭ごとの専用リンクです。ほかの方には送らないでください。同意は1回だけ受け付けます。</p>`}`;
  }
}
async function sendMon() {
  const a = {}, out = document.getElementById('r');
  for (const [k, l, t] of MON) { if (t === 'rate') { const v = document.querySelector(`input[name=${k}]:checked`); if (!v) { out.innerHTML = `<span class="err">「${esc(l)}」を選んでください。</span>`; return; } a[k] = +v.value; } else a[k] = document.getElementById(k).value.trim(); }
  if (DEMO) { out.innerHTML = '<span class="ok">見本なので送信しません。</span>'; return; }
  const r = await rpc('leo_mon_submit', { p_token: T, p_answers: a }); out.innerHTML = r.ok ? '<span class="ok">送信しました。ありがとうございました。</span>' : '<span class="err">送信できませんでした。時間をおいてもう一度お試しください。</span>';
}
async function sendDoui() {
  const out = document.getElementById('r');
  if (DEMO) { out.innerHTML = '<span class="ok">見本なので送信しません。</span>'; return; }
  if (!confirm('この計画に同意します。よろしいですか？')) return;
  document.getElementById('agb').disabled = true;
  const r = await rpc('leo_doui_submit', { p_token: T }); out.innerHTML = r.ok ? '<span class="ok">同意を受け付けました。ありがとうございました。</span>' : '<span class="err">送信できませんでした。すでに同意済みか、リンクの期限が切れている可能性があります。レオまでご連絡ください。</span>';
  if (r.ok) document.getElementById('agb').style.display = 'none'; else document.getElementById('agb').disabled = false;
}
load();
</script></body></html>
