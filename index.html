<script>

// 古いキャッシュの index/JS を捨てて再読込（打刻は Supabase のみ）
(function () {
  var BUILD = '20261109sbonly';
  try {
    var prev = localStorage.getItem('portalBuild');
    if (prev && prev !== BUILD) {
      localStorage.setItem('portalBuild', BUILD);
      location.reload();
      return;
    }
    localStorage.setItem('portalBuild', BUILD);
  } catch (e) {}
  window.PORTAL_BUILD = BUILD;
})();
const C = window.PORTAL_CONFIG;
// 見本モード（?demo=1）: ログイン不要・見本データのみ
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const $ = id => document.getElementById(id);
document.title = C.title;
$('ttl').textContent = C.title;
$('help').textContent = C.askButton ? C.helpText : '';
document.documentElement.style.setProperty('--main', C.themeColor);

// Supabase Auth（メール＋パスワード）でログイン
async function login() {
  $('msg').textContent = '';
  const r = await fetch(C.supabaseUrl + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { apikey: C.supabaseKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: $('em').value.trim(), password: $('pw').value }),
  });
  const j = await r.json();
  if (!r.ok) { $('msg').textContent = 'ログインできませんでした。メールとパスワードを確認してください。'; return; }
  localStorage.setItem('sess', JSON.stringify({ token: j.access_token, refresh: j.refresh_token, email: j.user.email, role: (j.user.app_metadata || {}).role || C.defaultRole, exp: Date.now() + j.expires_in * 1000 })); if (window.loadGL) loadGL();
  show();
}

function logout() { localStorage.removeItem('sess'); location.reload(); }

function tileHtml([icon, name, url, note, size, sample], color) {
  const list = DEMO && sample ? `<ul class="sample">${sample.map(x => `<li>${x}</li>`).join('')}</ul><small>（見本データ）</small>` : `<small>${note}</small>`;
  const link = url.startsWith('#') || url.endsWith('.html') ? `href="${url}"` : url ? `href="${url}" target="_blank"` : `href="#" onclick="alert('準備中です');return false"`;
  const accent = color ? `style="border-top:4px solid ${color}"` : '';

}

  const esc = x => String(x || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const editBtn = skyCanEdit() ? `<button type="button" class="inl back" style="margin-left:8px;font-size:12px" onclick="skyEditOpen('${esc(day)}')">直す</button>` : '';
  if (!r || !r.body) {
    el.innerHTML = `<div class="ds-h">毎日占い ${editBtn}</div><div class="ds-b note">今日分はまだありません（管理者は「直す」から書けます）。</div>`;
  } else {
    el.innerHTML = `<div class="ds-h">毎日占い ${editBtn}</div><div class="ds-b">${esc(r.body)}</div><div class="ds-t">今日のひとこと：${esc(r.tip)}</div>`;
  }
  el.hidden = false;
}
async function skyEditOpen(day) {
  if (!skyCanEdit()) return;
  let cur = { body: '', tip: '' };
  try {
    const rows = await sb(`portal_daily_sky?day=eq.${day}&select=body,tip`) || [];
    if (rows[0]) cur = rows[0];
  } catch (e) {}
  const body = prompt('本文（2〜3文）', cur.body || '');
  if (body === null) return;
  const tip = prompt('今日のひとこと', cur.tip || '');
  if (tip === null) return;
  const b = (body || '').trim(), tp = (tip || '').trim();
  if (!b || !tp) return alert('本文とひとことは必須です');
  try {
    // upsert: try patch, if none insert
    const existing = await sb(`portal_daily_sky?day=eq.${day}&select=day`) || [];
    if (existing.length) {
      await sb(`portal_daily_sky?day=eq.${day}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ body: b, tip: tp, updated_at: new Date().toISOString() }) });
    } else {
      await sb('portal_daily_sky', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ day, body: b, tip: tp }) });
    }
    await loadDailySky();
  } catch (e) { alert(e.message); }
}

  }).join('');
  $('view').innerHTML = back + `<h3>🗂️ 総務</h3><div id="sumu_sec">${groups}</div>`;
  const sec = document.getElementById('sumu_sec');
  // 給与口座・マイナンバー（本人の届出 #me）は全職員。トップから総務へ移した（2026-11-10 会長）。書類の署名の隣に出す
  if (!sec.querySelector('a[href="#me"]')) {
    const t = tileHtml(['📝', '給与口座・マイナンバー', '#me', '振込口座と本人の個人番号の届出'], '#555'), sg = sec.querySelector('a[href="#sign"]');
    if (sg) sg.insertAdjacentHTML('afterend', t); else sec.insertAdjacentHTML('afterbegin', '<div class="grid">' + t + '</div>');
  }
  if (await accAdmin()) {
    const t = '<a id="acc_tile" class="tile" href="acc.html" style="border-top:4px solid #2e6b4f"><span>📒</span>会計（簡易）<small>取引入力・仕訳帳・試算表（法人管理者のみ）</small></a>';
    const kh = [...sec.querySelectorAll('h4')].find(h => h.textContent.trim() === '経理'), kg = kh && kh.nextElementSibling;
    const tt = sec.querySelector('a[href="#taxcal"]') ? '' : tileHtml(['🧾', '税カレンダー', '#taxcal', '源泉・住民税（毎月10日）と年次の期限'], '#555');
    if (kg && kg.classList.contains('grid')) kg.insertAdjacentHTML('beforeend', tt + t); else sec.insertAdjacentHTML('beforeend', '<h4>経理</h4><div class="grid">' + tt + t + '</div>');
  } else if (!clerk && !sec.querySelector('a[href="#sign"]')) sec.insertAdjacentHTML('beforeend', '<p>そのほかの総務は事務の方だけが見られます。</p>');
  if (!clerk && !sec.querySelector('a[href="#shogu"]') && (DUTY === '管理者' || (typeof shoguUiCan === 'function' && await shoguUiCan()))) {
    const t = tileHtml(['💴', '処遇改善加算（試作）', '#shogu', '国保連PDF→自動配分案→フリーウェイCSV。本番運用前の試作'], '#555');
    const hh = [...sec.querySelectorAll('h4')].find(h => h.textContent.trim() === '人事労務'), hg = hh && hh.nextElementSibling;
    if (hg && hg.classList.contains('grid')) hg.insertAdjacentHTML('beforeend', t);
    else sec.insertAdjacentHTML('afterbegin', '<h4>人事労務</h4><div class="grid">' + t + '</div>');
  }
  // 職員マスタ・打刻設定：事務はタイル一覧に出る。管理者・会長は事務でなくても人事労務に出す

      else sec.insertAdjacentHTML('afterbegin', '<h4>人事労務</h4><div class="grid">' + extras.join('') + '</div>');

// 登録のないアドレスでも同じ表示にする（アカウントの有無を知られないため）
async function sendReset() {
  const email = $('fem').value.trim();
  if (!email.includes('@')) { $('fmsg').textContent = 'メールアドレスを入れてください。'; return; }
  const r = await fetch(C.supabaseUrl + '/auth/v1/recover?redirect_to=' + encodeURIComponent(location.origin + location.pathname), {
    method: 'POST', headers: { apikey: C.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
  $('fmsg').textContent = r.status === 429
    ? 'いま混み合っています。しばらくしてからもう一度お試しください。'
    : '登録されているアドレスなら、パスワード設定のメールを送りました。メールのボタンを押してパスワードを決めてください（24時間有効）。届かないときは管理者に連絡してください。';
}

// パスワード設定リンク（#access_token=...&type=recovery|invite）から来たとき
const AUTH_HASH = new URLSearchParams(location.hash.slice(1));
async function setPassword() {
  const pw = $('npw').value;
  if (pw.length < 8) { $('pmsg').textContent = '8文字以上にしてください。'; return; }
  const r = await fetch(C.supabaseUrl + '/auth/v1/user', { method: 'PUT',
    headers: { apikey: C.supabaseKey, Authorization: 'Bearer ' + AUTH_HASH.get('access_token'), 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw }) });
  if (!r.ok) { $('pmsg').textContent = 'リンクの期限が切れているかもしれません。管理者に新しいリンクをもらってください。'; return; }
  history.replaceState(null, '', location.pathname);
  $('setpw').hidden = true; $('login').hidden = false; $('msg').textContent = 'パスワードを決めました。ログインしてください。';
}
if (AUTH_HASH.get('access_token') && ['recovery', 'invite'].includes(AUTH_HASH.get('type'))) { $('login').hidden = true; $('setpw').hidden = false; }
