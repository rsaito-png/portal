<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>星心会 職員ポータル</title>
<style>
:root{--main:#2e6b4f}
body{font-family:system-ui,"Hiragino Sans",sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:var(--main);color:#fff;padding:14px 16px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
main{max-width:640px;margin:auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px #0002}
input,button{font-size:17px;width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #bbb}
button{background:var(--main);color:#fff;border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border-radius:12px;padding:22px 10px;text-align:center;text-decoration:none;color:#222;box-shadow:0 1px 3px #0002;font-size:18px}
.office{border-left:6px solid var(--c);text-align:left;padding:18px 14px}
.office small{display:inline;margin-left:6px}
.office{display:flex;align-items:center;gap:10px;min-height:56px}.office .lg{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#fff}.office .tx{min-width:0}.office .lg.ct{object-fit:contain;border-radius:6px}
.tile.main{grid-column:1/-1;padding:30px 10px;font-size:22px}
.sample{text-align:left;font-size:25px;margin:8px 0 0;padding-left:22px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:24px}td,th{border-bottom:1px solid #eee;padding:6px 4px;text-align:left}
body.wide-sheet main{max-width:1280px}
.sheet-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.msheet{width:max-content;font-size:16px}
table.msheet th,table.msheet td{white-space:normal;vertical-align:middle;padding:2px}
table.msheet th{font-size:12px;font-weight:700;line-height:1.2;word-break:break-all}
table.msheet input{field-sizing:fixed;width:auto;min-width:0;max-width:none;margin:0;padding:3px 4px;font-size:16px;box-sizing:border-box;display:inline-block}
table.kata-view{width:max-content;min-width:100%;font-size:18px}
table.kata-view th,table.kata-view td{white-space:nowrap;vertical-align:top}
table.sougei-view{width:max-content;min-width:100%;font-size:18px}
table.sougei-view th,table.sougei-view td{white-space:nowrap;vertical-align:top}
.note{color:#888;font-size:23px}.rec{margin:10px 0}.rec label{display:block;font-size:23px;color:#555}.rec textarea{width:100%;box-sizing:border-box;font-size:26px;padding:8px;border:1px solid #bbb;border-radius:8px;margin:2px 0 6px}.rec input{margin:2px 0 6px;padding:8px}
.ptabs button{width:auto;margin-right:6px;padding:8px 16px;background:#fff;color:#333;border:1px solid #bbb}.ptabs .on{background:var(--main);color:#fff}
h4{margin:14px 0 6px;font-size:25px}.kk.over{border-left:6px solid #d33}.kk.soon{border-left:6px solid #e6b800}.kk.ok{opacity:.6}.badge{background:#d33;color:#fff;border-radius:6px;padding:1px 6px;font-size:22px}.kk.soon .badge{background:#e6b800}.kk.ok .badge{background:#888}
.back{background:#fff;color:#333;border:1px solid #bbb;width:auto;padding:8px 14px}
h3{font-size:25px;color:#555;margin:20px 0 8px}
.tile span{display:block;font-size:44px}.tile small{display:block;color:#888;font-size:22px;margin-top:4px}
#out{background:none;border:1px solid #fff;width:auto;padding:6px 10px;font-size:24px}
#msg{color:#c00;min-height:1em}
.tile .badge{display:inline-block;font-size:23px;margin-bottom:4px}
h3.nx{font-size:18px;color:#333;margin:18px 0 10px}.nxl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.tile{min-width:0}.nxc{display:block;overflow:hidden;min-width:0;background:#fff;border-radius:14px;padding:20px 16px;text-decoration:none;color:#222;box-shadow:0 1px 4px #0003}.nxc span{font-size:30px;margin-right:10px}.nxc b{font-size:22px}.nxc small{display:block;color:#777;font-size:14px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile.big{padding:30px 10px;font-size:20px;font-weight:bold}.tile small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<header><span id="ttl"></span><button id="out" hidden onclick="logout()">ログアウト</button></header>
<main>
<div id="login" class="card"><p>メールアドレスとパスワードでログインしてください。</p>

<script>
const C = window.PORTAL_CONFIG;
// 見本モード（?demo=1）: ログイン不要・見本データのみ
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const $ = id => document.getElementById(id);
document.title = C.title;
$('ttl').textContent = C.title;
$('help').textContent = C.helpText;
document.documentElement.style.setProperty('--main', C.themeColor);

// Supabase Auth（メール＋パスワード）でログイン
async function login() {
  $('msg').textContent = '';
  const r = await fetch(C.supabaseUrl + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { apikey: C.supabaseKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: $('em').value.trim(), password: $('pw').value }),
  });
  const j = await r.json();
  if (!r.ok) { $('msg').textContent = 'ログインできませんでした。メールとパスワードを確認してください。'; return; }
  localStorage.setItem('sess', JSON.stringify({ token: j.access_token, refresh: j.refresh_token, email: j.user.email, role: (j.user.app_metadata || {}).role || C.defaultRole, exp: Date.now() + j.expires_in * 1000 })); if (window.loadGL) loadGL();
  show();
}

function logout() { localStorage.removeItem('sess'); location.reload(); }

function tileHtml([icon, name, url, note, size, sample], color) {
  const list = DEMO && sample ? `<ul class="sample">${sample.map(x => `<li>${x}</li>`).join('')}</ul><small>（見本データ）</small>` : `<small>${note}</small>`;
  const link = url.startsWith('#') || url.endsWith('.html') ? `href="${url}"` : url ? `href="${url}" target="_blank"` : `href="#" onclick="alert('準備中です');return false"`;
  const accent = color ? `style="border-top:4px solid ${color}"` : '';
  return `<a class="tile${size === 'main' ? ' main' : ''}" ${link} ${accent}><span>${icon}</span>${name}${list}</a>`;
}


// 事業所画面の本体。o.groups があれば「次にやること＋大ボタン（最大6〜8）」、無ければ従来のタイル一覧
const visTiles = o => o.tiles.filter(t => !t[6] || DUTY === '管理者' || t[6] === ROLE || t[6] === DUTY || (t[6] === '児発管' && canManage()));
const shortName = (o, n) => (o.short || {})[n] || n;
const myDuty = () => DUTY === '管理者' ? '管理者' : DUTY === '児発管' ? '児発管' : ROLE === '事務' ? '事務' : '現場支援員';
function groupList(o) {
  const vis = visTiles(o), used = new Set(); o.groups.forEach(g => g[2].forEach(n => used.add(n)));
  const rest = vis.filter(t => !used.has(t[1]));
  const catchAll = n => n === 'その他' || n === '全ての画面';
  const anyCatch = o.groups.some(x => catchAll(x[1]));
  return o.groups.map((g, i) => ({ k: i, icon: g[0], label: g[1], tiles: g[2].flatMap(n => vis.filter(t => t[1] === n)).concat(catchAll(g[1]) || (i === o.groups.length - 1 && !anyCatch) ? rest : []) })).filter(g => g.tiles.length);
}
const tl = (t, name, cls, color) => { const link = t[2] ? `href="${t[2]}"${/^https?:/.test(t[2]) ? ' target="_blank" rel="noopener"' : ''}` : 'style="opacity:.5"';
  return `<a class="tile ${cls}" ${link} style="border-top:4px solid ${color}"><span>${t[0]}</span>${name}<small>${t[3]}</small></a>`; };
function leoHomeBody(o) {
  const vis = visTiles(o), col = o.color;
  const mine = ((o.mine || {})[myDuty()] || []).flatMap(n => vis.filter(t => t[1] === n)).slice(0, 3);
  const big = (href, icon, label, id, on) => `<a class="tile big" href="${href}" ${on ? `onclick="${on}"` : ''} style="border-top:4px solid ${col}"><span>${icon}</span>${label}<small id="${id || ''}"></small></a>`;
  const groups = groupList(o);
  const pageG = groups.filter(x => x.label === '全ての画面' || x.label === 'その他');
  const gbtn = x => `<a class="tile big" href="#${o.id}/g${x.k}" style="border-top:4px solid ${col}"><span>${x.icon}</span>${x.label}</a>`;
  const g = groups.filter(x => !pageG.includes(x)).map(gbtn).join('');
  const tileBig = t => `<a class="tile big" ${t[2] ? `href="${t[2]}"` : ''} style="border-top:4px solid ${col}${t[2] ? '' : ';opacity:.5'}"><span>${t[0]}</span>${shortName(o, t[1])}${t[2] ? '' : '<small>準備中</small>'}</a>`;
  const rtv = (o.routine || []).flatMap(n => vis.filter(t => t[1] === n));
  const rt = rtv.length ? `<h3 class="nx">管理系ルーティン</h3><div class="grid">${rtv.map(tileBig).join('')}</div>` : '';
  const who = (o.who || []).map(([title, names]) => {
    const tiles = (names || []).flatMap(n => vis.filter(t => t[1] === n));
    return tiles.length ? `<h3 class="nx">${title}</h3><div class="grid">${tiles.map(tileBig).join('')}</div>` : '';
  }).join('');
  const dutyName = myDuty() === '事務' ? '情報' : myDuty() + 'の仕事';
  const dutyInner = `${mine.map(t => `<a class="tile big" href="${t[2]}" style="border-top:4px solid ${col}"><span>${t[0]}</span>${shortName(o, t[1])}</a>`).join('')}${g}`;
  const duty = dutyName === '児発管の仕事' ? (dutyInner ? `<div class="grid">${dutyInner}</div>` : '') : `<h3 class="nx">${dutyName}</h3><div class="grid">${dutyInner}</div>`;
  const pages = pageG.length ? `<h3 class="nx">レオのページ</h3><div class="grid">${pageG.map(gbtn).join('')}</div>` : '';
  return `<div id="leo_home_cal"></div><h3 class="nx">毎日やる</h3><div class="grid">
    ${big('#leo/kids', '🧒', '今日の利用児童', 'hs_kids', "PERIOD='today'")}
    ${big('#leo/linedraft', '✉️', 'LINEの下書き', '', '')}
    ${big('#leo/hiyari', '⚠️', 'ヒヤリハット', '', '')}</div>
    ${duty}
    ${who}${rt}${pages}`;
}
async function leoHomeStatus() {
  try { if (DEMO || typeof sb !== 'function') return;
    const t = today(), tm = addDays(t, 1);
    const [rows, evs0, LEFT] = await Promise.all([
      sb(`leo_nikki?day=gte.${t}&day=lte.${tm}&select=day,kind,pick_driver,pick_car,drop_driver,drop_car,child`),
      sb(`leo_events?day=gte.${t}&day=lte.${tm}&kind=in.(利用,迎え,送り,休み)&select=day,kind,child,kids,staff,start_time,end_time,place,kid_places,kid_times,source,updated_at,title,note`).catch(() => []),
      loadLeftIndex().catch(() => ({})),
    ]);
    const evs = typeof filterEventsByLeft === 'function' ? filterEventsByLeft(evs0 || [], LEFT) : (evs0 || []);
    const put = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
    put('hs_today', leoTileStatus(rows, evs, t));
    put('hs_tomorrow', leoTileStatus(rows, evs, tm));
    put('hs_kids', leoKidTile(rows, evs, t));
  } catch (e) { }
}
function officeBody(o) {
  if (o.home && o.groups) { setTimeout(leoHomeStatus, 0); if (typeof leoHomeCal === 'function') setTimeout(leoHomeCal, 0); return leoHomeBody(o); }
  if (!o.groups) return `<div class="grid">${visTiles(o).map(t => tileHtml(t, o.color)).join('')}</div>`;
  const vis = visTiles(o);
  const nx = ((o.next || {})[myDuty()] || []).flatMap(n => vis.filter(t => t[1] === n)).slice(0, 3);
  const next = `<h3 class="nx">次にやること</h3><div class="nxl">${nx.map(t => `<a class="nxc" href="${t[2]}" style="border-left:8px solid ${o.color}"><span>${t[0]}</span><b>${shortName(o, t[1])}</b><small>${t[3]}</small></a>`).join('')}</div>`;
  const gs = groupList(o);
  const btns = gs.map(g => g.tiles.length === 1 && g.tiles[0][2] ? `<a class="tile big" href="${g.tiles[0][2]}" style="border-top:4px solid ${o.color}"><span>${g.icon}</span>${g.label}</a>`
    : `<a class="tile big" href="#${o.id}/g${g.k}" style="border-top:4px solid ${o.color}"><span>${g.icon}</span>${g.label}</a>`).join('');
  return `${next}<h3 class="nx">メニュー</h3><div class="grid">${btns}</div>`;
}
// 大ボタンの先（1階層）。#leo/g0 など
function groupView(o, k) {
  const g = groupList(o).find(x => String(x.k) === k); if (!g) return false;
  $('view').innerHTML = `<button class="back" onclick="location.hash='${o.id}'">← ${o.name}へ</button>
    <h3 style="color:${o.color};font-size:20px">${g.icon} ${g.label}</h3><div class="grid">${g.tiles.map(t => tl(t, shortName(o, t[1]), '', o.color)).join('')}</div>`;
  if (o.id === 'leo') hiyariUnread().then(n => { const a = document.querySelector('a[href="#leo/hiyari"]'); if (a && n) a.insertAdjacentHTML('afterbegin', `<span class="badge">未読 ${n}</span>`); });
  return true;
}

// 画面切替は URL の #事業所id で行う（戻るボタン・ブラウザの戻るが両方効く）
async function render() {
  if (typeof loadDuty === 'function') await loadDuty();
  if (typeof ncCleanup === 'function') ncCleanup();
  const route = decodeURIComponent(location.hash.slice(1)).split('?')[0].split('/');
  if (!(route[0] === 'leo' && route[1] === 'day' && /^\d{4}-\d{2}-\d{2}$/.test(route[2] || '')) && typeof sgClearEdit === 'function') sgClearEdit();
  const [id, sub, sub2] = decodeURIComponent(location.hash.slice(1)).split('?')[0].split('/');
  if (!(id === 'leo' && (sub === 'kata' || sub === 'master'))) document.body.classList.remove('wide-sheet');
  if (id === 'leo' && sub === 'day' && /^\d{4}-\d{2}-\d{2}$/.test(sub2 || '') && typeof renderSgDay === 'function') return renderSgDay(sub2);
  if (id === 'leo' && LEO_VIEWS[sub]) return renderLeoView(sub);
  { const oo = C.offices.find(x => x.id === id); if (oo && oo.groups && /^g\d+$/.test(sub || '') && groupView(oo, sub.slice(1))) return; }
  if (id === 'suishodama' && sub === 'ledger') { SUI.edit = null; return renderSuiLedger(); }
  if (id === 'suishodama' && sub === 'contract') { SC.link = null; return renderSuiContract(); }
  if (id === 'suishodama' && sub === 'plan') { SUI.planId = null; return renderSuiPlan(); }
  if (id === 'kintoun' && sub === 'ledger') return renderKinLedger();
  if (id === 'kintoun' && sub === 'contract') return renderKinContract();
  if (id === 'kintoun' && sub === 'print') return renderKinPrint();
  if (id === 'kintoun' && sub === 'jisseki') return renderKinJisseki();
  if (id === 'kintoun' && sub === 'check') return renderKinCheck();
  if (id === 'kintoun' && sub === 'visit') { KV.id = null; return renderKinVisit(); }
  if (id === 'nicchu' && sub === 'log' && typeof renderNicchu === 'function') return renderNicchu();
  if (id === 'nicchu' && sub === 'jisseki' && typeof renderNicchuJisseki === 'function') return renderNicchuJisseki();
  if (id === 'nicchu' && sub === 'sign' && typeof renderNicchuSign === 'function') return renderNicchuSign();
  if (id === 'kintoun' && sub === 'consent') { KIN.name = null; return renderKin(); }
  if (id === 'dakoku' && typeof renderDakoku === 'function') return renderDakoku();
  if (id === 'rydeen' && sub && typeof renderRydeen === 'function') return renderRydeen(sub);
  if (id === 'ht') return renderHt();
  if (id === 'sct' && typeof renderSct === 'function') return renderSct();
  if (id === 'chair') return renderChair();
  if (id === 'banto' && typeof renderBanto === 'function') return renderBanto();
  if (id === 'sns' && typeof renderSns === 'function') return renderSns();
  if (id === 'soumu') return renderSoumu();
  if (id === 'soudan' && typeof renderSoudan === 'function') return renderSoudan();
  if (id === 'leaderboard' && typeof renderLeaderBoard === 'function') return renderLeaderBoard();
  if (id === 'mgr') return renderMgr();
  if (id === 'uketsuke') return renderUketsuke();
  if (id === 'sign' && typeof renderSign === 'function') return renderSign();
  if (id === 'clerk' && sub === 'docs' && (sub2 === 'new' || sub2 === 'paper') && typeof renderDocsForm === 'function') return renderDocsForm(sub2);
  if (id === 'clerk' && sub === 'docs' && typeof renderDocsAdmin === 'function') return renderDocsAdmin();
  const o = C.offices.find(x => x.id === id);
  if (o) {
    $('view').innerHTML = `<button class="back" onclick="location.hash=''">← 事業所えらびへ</button>
      <h3 style="color:${o.color}">${o.name}${o.kind ? '（' + o.kind + '）' : ''}</h3>
      ${officeBody(o)}`;
    if (o.id === 'suishodama' && typeof siMonthly === 'function') { $('view').insertAdjacentHTML('beforeend', '<div id="sui_month"></div>'); siMonthly(); }
    if (o.id === 'leo') hiyariUnread().then(n => { const a = document.querySelector('a[href="#leo/hiyari"]'); if (a && n) a.insertAdjacentHTML('afterbegin', `<span class="badge">未読 ${n}</span>`); });
    if (typeof chairMsgShow === 'function') chairMsgShow();
    return;
  }
  // 評定所タイルは HYOJOSHO_HOLD（leaderboard.js）が true のあいだ出さない。戻すときはそのフラグを false に。
  const topT = [['🏯', '評定所', '#leaderboard', '職員みんなと会長の報連相（報告・連絡・相談）', 'main'], ['🧑‍💼', '番頭さん', '#banto', '報告・連絡・相談はここへ（AIがすぐ返事、要るものは会長へ取り次ぎ）', 'main'], ['📸', 'SNS投稿素材', '#sns', 'Instagram・Googleマップ用の写真とひとことを送る', 'main'], ['🍵', '人事労務の相談所', '#soudan', '休み・給料・働き方の相談（総務奉行だけが読む）', 'main'], ['🎓', '法定研修', '#ht', '研修・委員会・訓練の記録と受講証明', 'main'], ['📚', '自主研鑽資料集', '', '準備中（中身はこれから）', 'main']].filter(t => t[2] !== '#leaderboard' || !(typeof HYOJOSHO_HOLD !== 'undefined' && HYOJOSHO_HOLD));
  const sec = C.sections || { sumu: { name: '総務', groups: [] }, misc: { name: '未整理', tiles: [] } };
  $('view').innerHTML = `<h3>事業所</h3>
    <div class="grid">${C.offices.map(x => `<a class="tile office" href="#${x.id}" style="--c:${x.color}">${x.logo?`<img class="lg${x.logoFit?' ct':''}" src="${x.logo}" alt="" loading="lazy">`:''}<span class="tx">${x.name}<small>${x.kind}</small></span></a>`).join('')}</div>
    <h3>共通</h3>
    <div class="grid">${topT.map(t => tileHtml(t)).join('')}</div><div id="sct_slot"></div>
    <div id="soumu_slot">${ROLE === C.clerk.role ? soumuTile() : ''}</div>
    <h3 id="misc_h">未整理</h3>
    <div class="grid">${C.shared.tiles.map(t => tileHtml(t, '#999')).join('')}</div>`;
  if (typeof esignBadge === 'function') esignBadge();
  if (typeof lbBadge === 'function') lbBadge();
  chairTile().then(() => typeof bnBadge === 'function' && bnBadge()); chairMsgShow(); accTile(); sctAdminTile();
}
async function sctIsAdmin() {
  if (DEMO) return ROLE === '事務' || ROLE === 'sct_admin';
  try {
    const s = JSON.parse(localStorage.getItem('sess') || 'null'); if (!s) return false;
    const r = await fetch(C.supabaseUrl + '/rest/v1/rpc/sct_is_admin', { method: 'POST', headers: { apikey: C.supabaseKey, Authorization: 'Bearer ' + s.token, 'Content-Type': 'application/json' }, body: '{}' });
    return r.ok && (await r.json()) === true;
  } catch (e) { return false; }
}
async function sctAdminTile() {
  const slot = document.getElementById('sct_slot');
  if (!slot || slot.dataset.on) return;
  if (!(await sctIsAdmin())) return;
  slot.dataset.on = '1';
  slot.innerHTML = `<div class="grid"><a class="tile main" href="#sct" style="border-top:4px solid #2e6b4f"><span>🩺</span>ストレスチェック実施者養成（運営）<small>開催・予約・入金・修了。手順は画面上部の運用マニュアル</small></a></div>`;
}
// 会計（簡易）への入口。法人管理者(acc_is_admin)にだけ出す。入れる画面は acc.html
async function accAdmin() {
  if (DEMO || typeof sb !== 'function') return false;
  try { const s = JSON.parse(localStorage.getItem('sess') || 'null'); if (!s) return false;
    const r = await fetch(C.supabaseUrl + '/rest/v1/rpc/acc_is_admin', { method: 'POST', headers: { apikey: C.supabaseKey, Authorization: 'Bearer ' + s.token, 'Content-Type': 'application/json' }, body: '{}' });
    return r.ok && (await r.json()) === true; } catch (e) { return false; }
}
// 総合トップの「総務」タイル。事務の方には常に、法人管理者には会計（簡易）があるので出す
const soumuTile = () => `<div class="grid"><a id="soumu_tile" class="tile main" href="#soumu" style="border-top:4px solid #555"><span>🗂️</span>総務<small>人事労務・補助金・助成金・経理など（事務の方のみ）</small></a></div>`;
async function accTile() {
  if (ROLE === C.clerk.role || document.getElementById('soumu_tile')) return;
  if (!(await accAdmin())) return;
  const sl = document.getElementById('soumu_slot'); if (sl && !document.getElementById('soumu_tile')) sl.innerHTML = soumuTile();
}
// #soumu：総務の見出しとタイル（事務の方は全部、法人管理者は会計（簡易）を経理の中に）
async function renderSoumu() {
  const back = `<button class="back" onclick="location.hash=''">← トップへ</button>`;
  const clerk = ROLE === C.clerk.role;
  $('view').innerHTML = back + `<h3>🗂️ 総務</h3><div id="sumu_sec">${clerk ? (C.clerk.groups || []).map(g => `${g.name ? `<h4>${g.name}</h4>` : ''}<div class="grid">${g.tiles.map(t => tileHtml(t, '#555')).join('')}</div>`).join('') : ''}</div>`;
  const sec = document.getElementById('sumu_sec');
  if (await accAdmin()) {
    const t = '<a id="acc_tile" class="tile" href="acc.html" style="border-top:4px solid #2e6b4f"><span>📒</span>会計（簡易）<small>取引入力・仕訳帳・試算表（法人管理者のみ）</small></a>';
    const kh = [...sec.querySelectorAll('h4')].find(h => h.textContent.trim() === '経理'), kg = kh && kh.nextElementSibling;
    if (kg && kg.classList.contains('grid')) kg.insertAdjacentHTML('beforeend', t); else sec.insertAdjacentHTML('beforeend', '<h4>経理</h4><div class="grid">' + t + '</div>');
  } else if (!clerk) sec.innerHTML = '<p>総務は事務の方だけが見られます。</p>';
}
window.addEventListener('hashchange', render);
let ROLE = C.defaultRole;

// 見本モードだけ: 職員／事務 の見え方を切り替え
function roleToggle() {
  return '<p>見え方：' + C.roles.map(r => `<label><input type="radio" name="role" value="${r}" ${r === ROLE ? 'checked' : ''} style="width:auto"> ${r}</label>`).join(' ') + '</p>';
}

function show() {
  const s = DEMO ? { email: '見本（デモ）', exp: Infinity, role: new URLSearchParams(location.search).get('role') || C.defaultRole } : JSON.parse(localStorage.getItem('sess') || 'null');
  if (!s || s.exp < Date.now()) { localStorage.removeItem('sess'); return; }
  $('login').hidden = true; $('home').hidden = false; $('out').hidden = false;
  $('hi').textContent = DEMO ? '見本モードです（ログインしていません）' : s.email + ' でログイン中';
  if (DEMO) { $('out').textContent = '見本を閉じる'; $('out').onclick = () => location.href = location.pathname; }
  ROLE = s.role || C.defaultRole;
  if (typeof ukInstallAsk === 'function') ukInstallAsk();
  if (DEMO) {
    $('hi').insertAdjacentHTML('afterend', roleToggle());
    document.querySelectorAll('input[name=role]').forEach(r => r.onchange = () => { ROLE = r.value; render(); });
  }
  render();
}

// はじめての方／パスワードを忘れた方：Supabase がパスワード設定メールを送る
// 登録のないアドレスでも同じ表示にする（アカウントの有無を知られないため）
async function sendReset() {
  const email = $('fem').value.trim();
  if (!email.includes('@')) { $('fmsg').textContent = 'メールアドレスを入れてください。'; return; }
  const r = await fetch(C.supabaseUrl + '/auth/v1/recover?redirect_to=' + encodeURIComponent(location.origin + location.pathname), {
    method: 'POST', headers: { apikey: C.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
  $('fmsg').textContent = r.status === 429
    ? 'いま混み合っています。しばらくしてからもう一度お試しください。'
    : '登録されているアドレスなら、パスワード設定のメールを送りました。メールのボタンを押してパスワードを決めてください（24時間有効）。届かないときは管理者に連絡してください。';
}

// パスワード設定リンク（#access_token=...&type=recovery|invite）から来たとき
const AUTH_HASH = new URLSearchParams(location.hash.slice(1));
async function setPassword() {
  const pw = $('npw').value;
  if (pw.length < 8) { $('pmsg').textContent = '8文字以上にしてください。'; return; }
  const r = await fetch(C.supabaseUrl + '/auth/v1/user', { method: 'PUT',
    headers: { apikey: C.supabaseKey, Authorization: 'Bearer ' + AUTH_HASH.get('access_token'), 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw }) });
  if (!r.ok) { $('pmsg').textContent = 'リンクの期限が切れているかもしれません。管理者に新しいリンクをもらってください。'; return; }
  history.replaceState(null, '', location.pathname);
  $('setpw').hidden = true; $('login').hidden = false; $('msg').textContent = 'パスワードを決めました。ログインしてください。';
}
if (AUTH_HASH.get('access_token') && ['recovery', 'invite'].includes(AUTH_HASH.get('type'))) { $('login').hidden = true; $('setpw').hidden = false; }

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
show();
</script></body></html>
