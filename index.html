<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>星心会 職員ポータル</title>
<style>
:root{--main:#2e6b4f}
body{font-family:system-ui,"Hiragino Sans",sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:var(--main);color:#fff;padding:14px 16px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
main{max-width:640px;margin:auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px #0002}
input,button{font-size:17px;width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #bbb}
button{background:var(--main);color:#fff;border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border-radius:12px;padding:22px 10px;text-align:center;text-decoration:none;color:#222;box-shadow:0 1px 3px #0002;font-size:18px}
.office{border-left:6px solid var(--c);text-align:left;padding:18px 14px}
.office small{display:inline;margin-left:6px}
.tile.main{grid-column:1/-1;padding:30px 10px;font-size:22px}
.sample{text-align:left;font-size:15px;margin:8px 0 0;padding-left:22px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}td,th{border-bottom:1px solid #eee;padding:6px 4px;text-align:left}
.note{color:#888;font-size:13px}.rec{margin:10px 0}.rec label{display:block;font-size:13px;color:#555}.rec input{margin:2px 0 6px;padding:8px}
.ptabs button{width:auto;margin-right:6px;padding:8px 16px;background:#fff;color:#333;border:1px solid #bbb}.ptabs .on{background:var(--main);color:#fff}
h4{margin:14px 0 6px;font-size:15px}.kk.over{border-left:6px solid #d33}.kk.soon{border-left:6px solid #e6b800}.kk.ok{opacity:.6}.badge{background:#d33;color:#fff;border-radius:6px;padding:1px 6px;font-size:12px}.kk.soon .badge{background:#e6b800}.kk.ok .badge{background:#888}
.back{background:#fff;color:#333;border:1px solid #bbb;width:auto;padding:8px 14px}
h3{font-size:15px;color:#555;margin:20px 0 8px}
.tile span{display:block;font-size:34px}.tile small{display:block;color:#888;font-size:12px;margin-top:4px}
#out{background:none;border:1px solid #fff;width:auto;padding:6px 10px;font-size:14px}
#msg{color:#c00;min-height:1em}
</style></head><body>
<header><span id="ttl"></span><button id="out" hidden onclick="logout()">ログアウト</button></header>
<main>
<div id="login" class="card"><p>メールアドレスとパスワードでログインしてください。</p>
<input id="em" type="email" placeholder="メールアドレス" autocomplete="username">
<input id="pw" type="password" placeholder="パスワード" autocomplete="current-password">
<button onclick="login()">ログイン</button>
<button onclick="location.search='?demo=1'" style="background:#fff;color:var(--main);border:1px solid var(--main)">見本を見る</button><div id="msg"></div></div>
<div id="setpw" class="card" hidden><p>新しいパスワードを決めてください（8文字以上）。</p>
<input id="npw" type="password" placeholder="新しいパスワード" autocomplete="new-password">
<button onclick="setPassword()">パスワードを決める</button><div id="pmsg"></div></div>
<div id="home" hidden><p id="hi"></p><div id="view"></div>
<p id="help" style="color:#888;font-size:13px"></p></div>
</main>
<script src="config.js"></script>
<script src="leo.js"></script>
<script>
const C = window.PORTAL_CONFIG;
// 見本モード（?demo=1）: ログイン不要・見本データのみ
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const $ = id => document.getElementById(id);
document.title = C.title;
$('ttl').textContent = C.title;
$('help').textContent = C.helpText;
document.documentElement.style.setProperty('--main', C.themeColor);

// Supabase Auth（メール＋パスワード）でログイン
async function login() {
  $('msg').textContent = '';
  const r = await fetch(C.supabaseUrl + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { apikey: C.supabaseKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: $('em').value.trim(), password: $('pw').value }),
  });
  const j = await r.json();
  if (!r.ok) { $('msg').textContent = 'ログインできませんでした。メールとパスワードを確認してください。'; return; }
  localStorage.setItem('sess', JSON.stringify({ token: j.access_token, email: j.user.email, role: (j.user.app_metadata || {}).role || C.defaultRole, exp: Date.now() + j.expires_in * 1000 }));
  show();
}

function logout() { localStorage.removeItem('sess'); location.reload(); }

function tileHtml([icon, name, url, note, size, sample], color) {
  const list = DEMO && sample ? `<ul class="sample">${sample.map(x => `<li>${x}</li>`).join('')}</ul><small>（見本データ）</small>` : `<small>${note}</small>`;
  const link = url.startsWith('#') || url.endsWith('.html') ? `href="${url}"` : url ? `href="${url}" target="_blank"` : `href="#" onclick="alert('準備中です');return false"`;
  const accent = color ? `style="border-top:4px solid ${color}"` : '';
  return `<a class="tile${size === 'main' ? ' main' : ''}" ${link} ${accent}><span>${icon}</span>${name}${list}</a>`;
}

// 画面切替は URL の #事業所id で行う（戻るボタン・ブラウザの戻るが両方効く）
function render() {
  const [id, sub] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (id === 'leo' && LEO_VIEWS[sub]) return renderLeoView(sub);
  const o = C.offices.find(x => x.id === id);
  if (o) {
    $('view').innerHTML = `<button class="back" onclick="location.hash=''">← 事業所えらびへ</button>
      <h3 style="color:${o.color}">${o.name}${o.kind ? '（' + o.kind + '）' : ''}</h3>
      <div class="grid">${o.tiles.filter(t => !t[6] || t[6] === ROLE).map(t => tileHtml(t, o.color)).join('')}</div>`;
    return;
  }
  $('view').innerHTML = `<h3>事業所をえらんでください</h3>
    <div class="grid">${C.offices.map(x => `<a class="tile office" href="#${x.id}" style="--c:${x.color}">${x.name}<small>${x.kind}</small></a>`).join('')}</div>
    <h3>${C.shared.name}</h3>
    <div class="grid">${C.shared.tiles.map(t => tileHtml(t)).join('')}</div>
    ${ROLE === C.clerk.role ? `<h3>${C.clerk.name}（事務の方のみ表示）</h3>
    <div class="grid">${C.clerk.tiles.map(t => tileHtml(t, '#555')).join('')}</div>` : ''}`;
}
window.addEventListener('hashchange', render);
let ROLE = C.defaultRole;

// 見本モードだけ: 職員／事務 の見え方を切り替え
function roleToggle() {
  return '<p>見え方：' + C.roles.map(r => `<label><input type="radio" name="role" value="${r}" ${r === ROLE ? 'checked' : ''} style="width:auto"> ${r}</label>`).join(' ') + '</p>';
}

function show() {
  const s = DEMO ? { email: '見本（デモ）', exp: Infinity, role: new URLSearchParams(location.search).get('role') || C.defaultRole } : JSON.parse(localStorage.getItem('sess') || 'null');
  if (!s || s.exp < Date.now()) { localStorage.removeItem('sess'); return; }
  $('login').hidden = true; $('home').hidden = false; $('out').hidden = false;
  $('hi').textContent = DEMO ? '見本モードです（ログインしていません）' : s.email + ' でログイン中';
  if (DEMO) { $('out').textContent = '見本を閉じる'; $('out').onclick = () => location.href = location.pathname; }
  ROLE = s.role || C.defaultRole;
  if (DEMO) {
    $('hi').insertAdjacentHTML('afterend', roleToggle());
    document.querySelectorAll('input[name=role]').forEach(r => r.onchange = () => { ROLE = r.value; render(); });
  }
  render();
}

// パスワード設定リンク（#access_token=...&type=recovery|invite）から来たとき
const AUTH_HASH = new URLSearchParams(location.hash.slice(1));
async function setPassword() {
  const pw = $('npw').value;
  if (pw.length < 8) { $('pmsg').textContent = '8文字以上にしてください。'; return; }
  const r = await fetch(C.supabaseUrl + '/auth/v1/user', { method: 'PUT',
    headers: { apikey: C.supabaseKey, Authorization: 'Bearer ' + AUTH_HASH.get('access_token'), 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw }) });
  if (!r.ok) { $('pmsg').textContent = 'リンクの期限が切れているかもしれません。管理者に新しいリンクをもらってください。'; return; }
  history.replaceState(null, '', location.pathname);
  $('setpw').hidden = true; $('login').hidden = false; $('msg').textContent = 'パスワードを決めました。ログインしてください。';
}
if (AUTH_HASH.get('access_token') && ['recovery', 'invite'].includes(AUTH_HASH.get('type'))) { $('login').hidden = true; $('setpw').hidden = false; }

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
show();
</script></body></html>
