<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会計（簡易）</title>
<style>
:root{--main:#2e6b4f}
body{font-family:system-ui,"Hiragino Sans",sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:var(--main);color:#fff;padding:14px 16px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff}
main{max-width:1000px;margin:auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px #0002;margin-bottom:12px}
input,select,button,textarea{font-size:16px;box-sizing:border-box;padding:9px;margin:3px 0;border-radius:8px;border:1px solid #bbb;max-width:100%}
input:not([type=checkbox]):not([type=radio]),select{width:100%}
button{background:var(--main);color:#fff;border:0;cursor:pointer;width:auto;padding:9px 16px}
button.sub{background:#fff;color:#333;border:1px solid #bbb}
button.red{background:#fff;color:#b00;border:1px solid #b00;padding:4px 10px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
nav a{padding:8px 14px;background:#fff;border:1px solid #bbb;border-radius:8px;color:#333;text-decoration:none}
nav a.on{background:var(--main);color:#fff;border-color:var(--main)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #eee;padding:5px 4px;text-align:left;vertical-align:top}
.r{text-align:right}.note{color:#777;font-size:13px}.ok{background:#dff3e4;padding:8px;border-radius:8px}.ng{background:#fde2e2;padding:8px;border-radius:8px}.warn{background:#fff3c4;padding:8px;border-radius:8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.ln{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;border-bottom:1px solid #eee;padding:6px 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
label{font-size:13px;color:#555;display:block}h2{margin:6px 0 10px;font-size:20px}h3{margin:4px 0 8px;font-size:16px}
.sec td{background:#f0f3f5;font-weight:bold}.tot td{font-weight:bold}
details{border-bottom:1px solid #eee;padding:4px 0}summary{cursor:pointer;padding:4px 0}
.scroll{overflow-x:auto}
.ptitle{display:none}
@media print{header,nav,.noprint,#nav{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}.ptitle{display:block;margin:6px 0}textarea{border:0}table{font-size:11px}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="theme-retro.css?v=20261128eye">
<style>
.pw-wrap{position:relative;width:100%;margin:3px 0}
.pw-wrap input{margin:0;padding-right:48px;width:100%;box-sizing:border-box;display:block}
#login button.pw-toggle,button.pw-toggle{position:absolute;right:2px;top:0;bottom:0;width:44px!important;min-width:44px!important;max-width:44px!important;min-height:0!important;height:auto!important;margin:0!important;padding:0!important;border:0!important;border-radius:8px!important;background:transparent!important;background-image:none!important;color:#555!important;box-shadow:none!important;text-shadow:none!important;cursor:pointer;display:flex!important;align-items:center;justify-content:center;line-height:0;z-index:1}
button.pw-toggle:hover{background:transparent!important;color:#222!important;box-shadow:none!important}
button.pw-toggle:focus-visible{outline:2px solid #888;outline-offset:0}
button.pw-toggle svg{width:22px;height:22px;display:block;pointer-events:none}
</style>
</head><body>
<header><span>📒 会計（簡易）</span><span><a href="index.html">← ポータルへ</a></span></header>
<main>
<div id="login" class="card" hidden><p>法人管理者のメールアドレスでログインしてください。</p>
<input id="em" type="email" placeholder="メールアドレス" autocomplete="username">
<div class="pw-wrap"><input id="pw" type="password" placeholder="パスワード" autocomplete="current-password"><button type="button" class="pw-toggle" aria-label="パスワードを表示" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<button onclick="accLogin()">ログイン</button><div id="msg" style="color:#c00"></div></div>
<div id="app" hidden><nav id="nav"></nav><div id="view"></div></div>
<div id="deny" class="card" hidden>この画面は法人管理者だけが使えます。<br><a href="index.html">ポータルへ戻る</a></div>
<p id="boot" class="note">読み込み中…</p>
</main>
<script src="config.js?v=20261105askoff"></script>
<script src="uketsuke.js?v=20261105askoff"></script>
<script src="cf.js?v=202610174"></script>
<script src="taxcalc.js?v=202610201"></script>
<script src="taxpack.js?v=202610201"></script>
<script src="tax.js?v=202610201"></script>
<script src="depcalc.js?v=202610201"></script>
<script src="dep.js?v=202610201"></script>
<script src="ledger.js?v=202610181"></script>
<script src="csvfmt.js?v=202610201"></script>
<script src="acc.js?v=202610211600"></script>
<script src="pc-scale.js?v=20261128eye"></script>
<script src="to-top.js?v=20261105top"></script>
<script>
(function(){
  var input=document.getElementById('pw'); if(!input) return;
  var btn=input.parentElement&&input.parentElement.querySelector('.pw-toggle'); if(!btn) return;
  var eye='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var eyeOff='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.3 21.3 0 0 1 5.06-6.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  btn.addEventListener('click', function(e){
    e.preventDefault();
    var show=input.type==='password';
    var start=input.selectionStart, end=input.selectionEnd;
    input.type=show?'text':'password';
    try{if(start!=null)input.setSelectionRange(start,end);}catch(err){}
    btn.setAttribute('aria-label', show?'パスワードをかくす':'パスワードを表示');
    btn.setAttribute('aria-pressed', show?'true':'false');
    btn.innerHTML=show?eyeOff:eye;
    input.focus();
  });
})();
</script>
</body></html>
