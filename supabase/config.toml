# Edge Function の verify_jwt だけをここで指定する。
# db や auth の設定は Supabase ダッシュボード側を正とする。このファイルは functions deploy が読む。
# jippi-checkout と sct-checkout と chamu-translate はログイン JWT を検証する（節を足さない＝verify_jwt は true のまま）。
# chamu-translate は関数の中で chamu_can() が true の人だけ通す。anon キーでは通せない。

[functions.square-webhook]
verify_jwt = false

[functions.meet-events]
verify_jwt = false
